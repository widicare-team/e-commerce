<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Widi Care — Quiz de Rotina Capilar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#26121B;
    --ink-soft:#7C5A68;
    --rose:#FF0084;          /* cor exata extraída da logo Widi Care */
    --rose-deep:#C40067;
    --rose-soft:#FF6FC0;
    --blush:#FFE9F4;
    --off:#FFFAFC;
    --off-2:#FBEEF5;
    --card:#FFFFFF;
    --line:rgba(255,0,132,.14);
    --shadow:0 20px 50px -20px rgba(255,0,132,.35);
    --radius:26px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Plus Jakarta Sans',sans-serif;
    background:
      radial-gradient(600px 400px at 90% -10%, var(--blush) 0%, transparent 60%),
      radial-gradient(500px 380px at -10% 110%, #FDEDEF 0%, transparent 55%),
      var(--off);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px 14px;
  }
  h1,h2,h3{font-family:'Fredoka',sans-serif; font-weight:600; margin:0;}
  .app{
    width:100%;
    max-width:460px;
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    overflow:hidden;
    position:relative;
    border:1px solid rgba(232,83,111,.08);
  }
  .topbar{
    display:flex;
    align-items:center;
    gap:10px;
    padding:18px 20px 10px;
  }
  .back-btn{
    width:34px;height:34px;border-radius:50%;
    border:1px solid var(--line);
    background:#fff;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    flex:none;
    color:var(--ink);
    transition:.15s;
  }
  .back-btn:hover{background:var(--blush); border-color:var(--rose-soft);}
  .back-btn.hidden{visibility:hidden;}
  .progress-wrap{flex:1; height:34px; display:flex; align-items:center; gap:10px;}
  .progress-track{
    flex:1; height:8px; background:var(--off-2); border-radius:999px; overflow:hidden; position:relative;
  }
  .progress-fill{
    height:100%; border-radius:999px;
    background:linear-gradient(90deg, var(--rose-soft), var(--rose));
    width:0%;
    transition:width .45s cubic-bezier(.65,0,.35,1);
  }
  .progress-label{font-size:12px; color:var(--ink-soft); font-weight:600; white-space:nowrap;}
  .curl-mark{flex:none; color:var(--rose);}
  .screen{padding:8px 26px 30px; animation:fadeIn .35s ease;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  /* INTRO */
  .intro{text-align:center; padding:38px 30px 32px;}
  .logo{ margin-bottom:26px; }
  .logo img{ height:34px; width:auto; display:block; margin:0 auto; }
  .intro h1{font-size:30px; line-height:1.18; margin-bottom:14px;}
  .intro h1 em{font-style:normal; color:var(--rose); font-weight:700;}
  .intro p{color:var(--ink-soft); font-size:15px; line-height:1.55; margin-bottom:26px;}
  .trust{display:flex; justify-content:center; gap:18px; margin-top:18px; font-size:12.5px; color:var(--ink-soft);}
  .trust span{display:flex; align-items:center; gap:6px;}

  .btn-primary{
    width:100%; border:none; cursor:pointer;
    background:linear-gradient(135deg, var(--rose), var(--rose-deep));
    color:#fff; font-family:'Plus Jakarta Sans',sans-serif; font-weight:700; font-size:15.5px;
    padding:16px 20px; border-radius:16px;
    box-shadow:0 14px 28px -12px rgba(196,56,89,.55);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn-primary:hover{transform:translateY(-1px); box-shadow:0 18px 32px -12px rgba(196,56,89,.65);}
  .btn-primary:disabled{opacity:.45; cursor:not-allowed; transform:none; box-shadow:none;}
  .btn-secondary{
    width:100%; border:1.5px solid var(--line); background:#fff; color:var(--ink);
    font-weight:700; font-size:14.5px; padding:13px 18px; border-radius:16px; cursor:pointer;
  }

  /* QUESTIONS */
  .eyebrow{font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--rose); margin-bottom:8px;}
  .q-title{font-size:22px; line-height:1.28; margin-bottom:20px;}
  .options{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .options.single-col{grid-template-columns:1fr;}
  .opt{
    border:1.5px solid var(--line); background:#fff; border-radius:18px;
    padding:16px 12px; cursor:pointer; text-align:left;
    display:flex; flex-direction:column; gap:10px;
    transition:.15s ease; position:relative;
  }
  .opt.wide{flex-direction:row; align-items:center; gap:12px; padding:14px 16px;}
  .opt:hover{border-color:var(--rose-soft); background:var(--blush);}
  .opt.selected{border-color:var(--rose); background:var(--blush); box-shadow:0 0 0 3px rgba(232,83,111,.12);}
  .opt-icon{color:var(--rose-deep); width:30px; height:30px; flex:none;}
  .opt-label{font-weight:700; font-size:14px; line-height:1.3;}
  .opt-sub{font-size:11.5px; color:var(--ink-soft); font-weight:500;}

  /* LEAD */
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-bottom:6px;}
  .field input[type=text], .field input[type=email], .field input[type=tel]{
    width:100%; padding:13px 14px; border-radius:14px; border:1.5px solid var(--line);
    font-family:'Plus Jakarta Sans',sans-serif; font-size:14.5px; color:var(--ink); background:var(--off);
    outline:none; transition:.15s;
  }
  .field input:focus{border-color:var(--rose); background:#fff;}
  .consent{display:flex; gap:10px; align-items:flex-start; margin:18px 0 20px; font-size:12.5px; color:var(--ink-soft); line-height:1.5;}
  .consent input{margin-top:3px; flex:none; accent-color:var(--rose);}
  .consent a{color:var(--rose-deep); font-weight:700; text-decoration:none;}
  .lead-note{font-size:11.5px; color:var(--ink-soft); text-align:center; margin-top:12px;}

  /* RESULT */
  .diag-card{
    background:linear-gradient(160deg, var(--blush), #fff 65%);
    border-radius:20px; padding:20px; margin-bottom:20px; border:1px solid rgba(232,83,111,.15);
  }
  .diag-eyebrow{font-size:11.5px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--rose-deep); margin-bottom:6px;}
  .diag-text{font-size:16px; line-height:1.5; font-family:'Fredoka',sans-serif; font-weight:600;}
  .diag-text b{color:var(--rose-deep); font-style:normal; font-weight:700;}

  .section-title{font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); margin:22px 0 10px;}
  .product-card{
    display:flex; gap:12px; border:1.5px solid var(--line); border-radius:18px; padding:12px; margin-bottom:10px; background:#fff;
    align-items:center;
  }
  .product-swatch{
    width:56px; height:56px; border-radius:14px; flex:none;
    background:linear-gradient(150deg, var(--rose-soft), var(--rose));
    display:flex; align-items:center; justify-content:center; color:#fff; font-family:'Fredoka',sans-serif; font-weight:700; font-size:15px;
  }
  .product-info{flex:1; min-width:0;}
  .product-name{font-weight:700; font-size:13.5px; line-height:1.3; margin-bottom:3px;}
  .product-tag{font-size:11px; color:var(--rose-deep); font-weight:700; margin-bottom:5px;}
  .product-price{font-size:13.5px; font-weight:800;}
  .product-price .old{font-weight:600; color:var(--ink-soft); text-decoration:line-through; margin-right:6px; font-size:12px;}
  .add-btn{
    flex:none; border:none; background:var(--ink); color:#fff; font-weight:700; font-size:12px;
    padding:9px 12px; border-radius:12px; cursor:pointer; white-space:nowrap;
  }
  .add-btn:hover{background:var(--rose-deep);}

  .crosssell{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px;}
  .chip{
    flex:none; border:1.5px solid var(--line); border-radius:999px; padding:8px 14px; font-size:12px; font-weight:700;
    background:#fff; white-space:nowrap; color:var(--ink-soft);
  }

  details.routine{border:1.5px solid var(--line); border-radius:16px; padding:14px 16px; margin-top:20px;}
  details.routine summary{cursor:pointer; font-weight:700; font-size:13.5px; list-style:none; display:flex; justify-content:space-between; align-items:center;}
  details.routine summary::-webkit-details-marker{display:none;}
  .routine-list{margin-top:12px; padding-left:0; list-style:none; font-size:13px; color:var(--ink-soft); line-height:1.9;}
  .routine-list li{display:flex; gap:8px;}
  .routine-list b{color:var(--ink); font-weight:700;}

  .share-row{display:flex; gap:10px; margin-top:20px;}
  .share-row button{flex:1; padding:12px; border-radius:14px; border:1.5px solid var(--line); background:#fff; font-weight:700; font-size:12.5px; cursor:pointer; color:var(--ink);}
  .share-row button:hover{background:var(--off-2);}

  .restart{text-align:center; margin-top:18px;}
  .restart button{background:none; border:none; color:var(--ink-soft); font-size:12.5px; text-decoration:underline; cursor:pointer; font-weight:600;}

  .dev-note{
    font-size:11px; color:var(--ink-soft); background:var(--off-2); border-radius:12px; padding:10px 12px; margin-top:22px; line-height:1.5;
  }
  .dev-note b{color:var(--ink);}

  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:#fff; padding:12px 20px; border-radius:999px; font-size:13px; font-weight:600;
    opacity:0; transition:.25s ease; pointer-events:none; z-index:50; white-space:nowrap; box-shadow:0 10px 30px rgba(0,0,0,.25);
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .banner{
    background:var(--ink); color:#fff; font-size:11.5px; text-align:center; padding:9px 16px; line-height:1.5;
  }
  .banner b{color:var(--rose-soft);}
</style>
</head>
<body>

<div class="app" id="app">
  <div class="banner">Protótipo funcional · <b>preços e estoque reais</b> puxados do catálogo Nuvemshop · combinações sem SKU definido aparecem sinalizadas</div>
  <div class="topbar">
    <button class="back-btn hidden" id="backBtn" aria-label="Voltar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="progress-wrap" id="progressWrap" style="display:none;">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-label" id="progressLabel"></div>
    </div>
  </div>
  <div id="screenHost"></div>
</div>

<div class="toast" id="toast"></div>

function curlSVG(w,h,stroke){
  return `<svg viewBox="0 0 100 100" width="${w}" height="${h}" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M12 70 C 12 40, 40 20, 55 35 C 68 48, 55 62, 42 55 C 32 50, 35 38, 48 38 C 62 38, 70 55, 60 68 C 50 80, 30 82, 20 68"
      stroke="${stroke||'currentColor'}" stroke-width="7" stroke-linecap="round" fill="none"/>
  </svg>`;
}

/* GA4 / Meta Pixel — stub de rastreamento por etapa (seção 7 do escopo) */
function trackEvent(name, params){
  console.log('[quiz:event]', name, params||{});
  // Em produção: gtag('event', name, params) + fbq('trackCustom', name, params)
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._h);
  toast._h = setTimeout(()=>t.classList.remove('show'), 2600);
}

function render(){
  if(state.screen==='intro') return renderIntro();
  if(state.screen==='question') return renderQuestion();
  if(state.screen==='lead') return renderLead();
  if(state.screen==='result') return renderResult();
}

function updateChrome(){
  if(state.screen==='intro' || state.screen==='result'){
    backBtn.classList.add('hidden');
    progressWrap.style.display = 'none';
    return;
  }
  progressWrap.style.display = 'flex';
  backBtn.classList.remove('hidden');
  const totalSteps = QUESTIONS.length + 1; // + tela de lead
  let currentStep = state.screen==='lead' ? QUESTIONS.length : state.qIndex;
  const pct = ((currentStep) / totalSteps) * 100;
  progressFill.style.width = pct + '%';
  progressLabel.textContent = state.screen==='lead' ? 'Quase lá' : `${state.qIndex+1} de ${QUESTIONS.length}`;
}

backBtn.addEventListener('click', ()=>{
  if(state.screen==='lead'){ state.screen='question'; state.qIndex = QUESTIONS.length-1; }
  else if(state.screen==='question'){
    if(state.qIndex===0){ state.screen='intro'; }
    else { state.qIndex -= 1; }
  }
  render(); updateChrome();
});

  host.querySelectorAll('.opt').forEach(btn=>{

    });
  });
}

/* ---------- LEAD CAPTURE ---------- */
function phoneMask(v){
  v = v.replace(/\D/g,'').slice(0,11);
  if(v.length>6) return `(${v.slice(0,2)}) ${v.slice(2,7)}-${v.slice(7)}`;
  if(v.length>2) return `(${v.slice(0,2)}) ${v.slice(2)}`;
  return v;
}
function renderLead(){
  const L = state.lead;
  host.innerHTML = `
    <div class="screen">
      <div class="eyebrow">Captura de lead</div>
      <h2 class="q-title">Quase lá! Pra onde enviamos sua rotina personalizada?</h2>
      <div class="field">

      </div>

      </div>
      <label class="consent">

        <span>Quero receber minha rotina personalizada e novidades da Widi Care por e-mail e WhatsApp. Ao continuar, você concorda com nossa <a href="#" onclick="return false;">Política de Privacidade</a>.</span>
      </label>
      <button class="btn-primary" id="submitLead" disabled>Receber meu cronograma</button>
      <div class="lead-note">Seus dados são usados só pra sua rotina — nada de spam, WidiLover 💗</div>
    </div>`;

  const nome = document.getElementById('fNome');
  const email = document.getElementById('fEmail');
  const whats = document.getElementById('fWhats');
  const consent = document.getElementById('fConsent');
  const submitBtn = document.getElementById('submitLead');

  function validate(){
    const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim());
    const ok = nome.value.trim().length>1 && emailOk && consent.checked;
    submitBtn.disabled = !ok;
    return ok;
  }
  nome.addEventListener('input', ()=>{ L.nome=nome.value; validate(); });
  email.addEventListener('input', ()=>{ L.email=email.value; validate(); });
  whats.addEventListener('input', ()=>{ whats.value = phoneMask(whats.value); L.whatsapp=whats.value; validate(); });
  consent.addEventListener('change', ()=>{ L.consent=consent.checked; validate(); });
  validate();

  submitBtn.addEventListener('click', ()=>{
    if(!validate()) return;
    const result = computeResult(state.answers);
    const tags = ['origem_quiz',
      `cacho_${slug(state.answers.hairType)}`,
      `necessidade_${slug(state.answers.need)}`,
      `porosidade_${slug(state.answers.porosity)}`];
    // Stub do envio pro Perfit (Myperfit) — em produção: POST via webhook/API com os campos abaixo
    console.log('[perfit:lead_payload]', { nome:L.nome, email:L.email, whatsapp:L.whatsapp, tags, automation:'boas_vindas_quiz' });
    trackEvent('quiz_lead_captured', {tags});
    submitBtn.textContent = 'Enviando...';
    submitBtn.disabled = true;
    setTimeout(()=>{
      state.screen='result';
      state._result = result;
      trackEvent('quiz_complete');
      render(); updateChrome();
    }, 550);
  });
}
function slug(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,''); }

/* ============ MOTOR DE RECOMENDAÇÃO — 5 camadas (seção 4 do escopo) ============ */
function computeResult(a){
  let core, coreKey, reason, layer1Applied=false;

  // Camada 1 — mood sobrepõe curvatura
  if(a.mood==='Quimicamente Tratado'){ core=CATALOG.quimico; coreKey='quimico'; reason='cuidado pós-química é a prioridade agora'; layer1Applied=true; }
  else if(a.mood==='Tingido'){ core=CATALOG.loiro_perfeito; coreKey='loiro_perfeito'; reason='proteção de cor é o foco principal'; layer1Applied=true; }
  else if(a.mood==='Em transição'){ core=CATALOG.juba_transicao; coreKey='juba_transicao'; reason='sua transição capilar pede uma linha dedicada'; layer1Applied=true; }
  else if(a.mood==='Grisalho/Platinado'){ core=CATALOG.loiro_perfeito; coreKey='loiro_perfeito'; reason='matização e reparação para fios grisalhos'; layer1Applied=true; }

  // Camada 2 — tipo de cabelo define a linha core (quando camada 1 não se aplica)
  if(!layer1Applied){
    if(a.hairType==='Liso'){ core=CATALOG.liso; coreKey='liso'; reason='seu fio liso pede leveza e controle'; }
    else if(a.hairType==='Ondulado'){ core=CATALOG.juba_ondulado; coreKey='juba_ondulado'; reason='sua onda pede definição sem pesar'; }
    else if(a.hairType==='Cacheado'){ core=CATALOG.juba_cacheado; coreKey='juba_cacheado'; reason='seu cacho pede definição com nutrição'; }
    else if(a.hairType==='Crespo'){ core=CATALOG.juba_crespo; coreKey='juba_crespo'; reason='seu crespo pede hidratação profunda e modelagem'; }
  }

  // Camada 3 — necessidade define a categoria dentro da linha core
  let mainProducts = [];
  const need = a.need;
  if(need==='Hidratação'){
    if(core.mascara) mainProducts.push(core.mascara);
    mainProducts.push(CATALOG.reforco.caviar);
  } else if(need==='Definição'){
    if(core.gelatina) mainProducts.push(core.gelatina);
    else if(core.creme) mainProducts.push(core.creme);
    else if(core.mousse) mainProducts.push(core.mousse);
  } else if(need==='Redução de frizz'){
    mainProducts.push(CATALOG.crosssell.moroccan);
    if(core.mascara) mainProducts.push(core.mascara);
  } else if(need==='Volume e Movimento'){
    mainProducts.push(CATALOG.cabeleira.shampoo, CATALOG.cabeleira.condicionador);
  } else if(need==='Oleosidade na raiz'){
    mainProducts.push(CATALOG.detox.shampoo);
  } else if(need==='Crescimento'){
    mainProducts.push(CATALOG.cabeleira.tonico, CATALOG.power_shot.kit);
  } else if(need==='Cronograma Completo'){
    mainProducts.push(CATALOG.super_poderosas.kit);
  }
  if(mainProducts.length===0 && core.shampoo) mainProducts.push(core.shampoo);

  // Camada 4 — porosidade refina a fórmula
  let porosityNote = '';
  if(a.porosity==='Alta'){
    porosityNote = 'fórmulas intensivas de reconstrução, sem medo de peso';
    if(core.antiporosidade) mainProducts.unshift(core.antiporosidade);
  } else if(a.porosity==='Baixa'){
    porosityNote = 'fórmulas leves — nada de manteiga pesada, seu fio já é resistente à absorção';
    mainProducts.push(CATALOG.entrada.sou10);
  } else if(a.porosity==='Não sei'){
    porosityNote = 'fórmula intermediária — no resultado, ensino como identificar sua porosidade em casa';
  } else {
    porosityNote = 'fórmula padrão, equilibrada pro seu fio';
  }

  // Camada 5 — rotina define o tamanho do kit
  let kitLabel='', routineSteps=[], maxItems=3;
  if(a.routine==='Só uso shampoo e condicionador'){
    kitLabel = 'Kit essencial';
    if(core.shampoo) mainProducts.unshift(core.shampoo);
    if(core.condicionador) mainProducts.splice(1,0,core.condicionador);
    mainProducts.push(CATALOG.entrada.sou10);
    routineSteps = ['Shampoo — 2 a 3x por semana','Condicionador — todo banho','Leave-in — pra fixar o hábito de finalizar'];
  } else if(a.routine==='Já uso leavein/creme'){
    kitLabel = 'Kit intermediário';
    if(core.shampoo) mainProducts.unshift(core.shampoo);
    routineSteps = ['Shampoo — 2x por semana','Condicionador — todo banho','Máscara ou finalizador da sua necessidade — 1x por semana'];
  } else if(a.routine==='Rotina completa'){
    // Kit completo (shampoo + condicionador + item da necessidade) + produto complementar/upgrade pontual
    kitLabel = 'Kit completo + upgrade pontual';
    maxItems = 4;
    if(core.condicionador) mainProducts.unshift(core.condicionador);
    if(core.shampoo) mainProducts.unshift(core.shampoo);
    let complement;
    if(need==='Redução de frizz' || need==='Definição') complement = CATALOG.crosssell.supershine;
    else if(need==='Crescimento' || need==='Cronograma Completo') complement = CATALOG.power_shot.kit;
    else complement = CATALOG.reforco.argan;
    mainProducts.push(complement);
    routineSteps = ['Shampoo — 2x por semana','Condicionador — todo banho','Máscara/finalizador da sua necessidade — 1x por semana','Complemento pontual (ampola, óleo de finalização ou Super Shine) — reforço semanal ou quinzenal'];
  } else {
    kitLabel = 'Kit iniciante + modo de uso';
    if(core.shampoo) mainProducts.unshift(core.shampoo);
    if(core.condicionador) mainProducts.splice(1,0,core.condicionador);
    routineSteps = ['Passo 1 — Shampoo pra limpar sem ressecar','Passo 2 — Condicionador pra desembaraçar','Passo 3 — Finalizador da sua necessidade, sempre com o fio molhado'];
  }

  // dedup + limita à quantidade de itens definida pela camada 5
  const seen = new Set();
  mainProducts = mainProducts.filter(p=>{ if(!p) return false; const k=p.name; if(seen.has(k)) return false; seen.add(k); return true; }).slice(0,maxItems);

  const crossSell = [CATALOG.crosssell.supershine, CATALOG.crosssell.hairbody, CATALOG.crosssell.lavemosol];

  const diagLabel = a.hairType + (a.mood!=='Nenhum desses' ? ` (${a.mood.toLowerCase()})` : '');
  const diagnosisText = `Seu cabelo é <b>${diagLabel}</b> com porosidade <b>${a.porosity.toLowerCase()}</b> — isso significa que ele pede ${porosityNote}, com foco em <b>${need.toLowerCase()}</b>.`;

  return { core, coreKey, reason, mainProducts, crossSell, kitLabel, routineSteps, diagnosisText, porosityNote };
}

/* ---------- RESULT ---------- */
function money(v){ return v==null ? '' : v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function initials(name){ return name.split(' ').filter(w=>w.length>2).slice(0,2).map(w=>w[0]).join('').toUpperCase(); }

function renderResult(){
  const r = state._result;
  host.innerHTML = `
    <div class="screen">
      <div class="diag-card">
        <div class="diag-eyebrow">Seu diagnóstico</div>
        <div class="diag-text">${r.diagnosisText}</div>
      </div>

      <div class="section-title">Recomendado pra você · ${r.kitLabel}</div>
      ${r.mainProducts.map(p=>`
        <div class="product-card">
          <div class="product-swatch">${initials(p.name.replace('(referência)','').trim())}</div>
          <div class="product-info">
            <div class="product-name">${p.name}${p.mock?' <span style="color:var(--rose-deep);font-weight:700;">· sem SKU definido</span>':''}</div>
            <div class="product-tag">${r.core.label}</div>
            <div class="product-price">${p.promo?`<span class="old">${money(p.price)}</span>${money(p.promo)}`:(p.price!=null?money(p.price):'a definir')}</div>
          </div>
          <button class="add-btn" data-name="${p.name}">${p.mock?'Avisar quando tiver':'Adicionar'}</button>
        </div>`).join('')}

      <div class="section-title">Você também pode gostar</div>
      <div class="crosssell">
        ${r.crossSell.map(p=>`<div class="chip">${p.name.replace('(referência) ','')}${p.mock?' ·mock':''}</div>`).join('')}
      </div>

      <details class="routine">
        <summary>Ver rotina completa sugerida <span>＋</span></summary>
        <ul class="routine-list">
          ${r.routineSteps.map((s,i)=>`<li><b>${i+1}.</b> ${s}</li>`).join('')}
        </ul>
      </details>

      <div class="share-row">
        <button id="shareIG">Compartilhar no Instagram</button>
        <button id="shareWA">Compartilhar no WhatsApp</button>
      </div>

      <div class="restart"><button id="restartBtn">Refazer o quiz</button></div>

      <div class="dev-note">
        <b>Nota de desenvolvimento —</b> preços e nomes reais vêm do catálogo Nuvemshop via API/MCP.
        Itens marcados <b>"sem SKU definido"</b> correspondem a linhas citadas no escopo (Blindando a Juba,
        Juba Bond Define Repair, Bond Gloss Repair, Hair & Body Splash, Lá Vem o Sol) sem produto correspondente
        encontrado no catálogo atual — ver seção 10 do escopo pra confirmar SKUs antes de ir pra produção.
      </div>
    </div>`;

  host.querySelectorAll('.add-btn').forEach(b=>{
    b.addEventListener('click', ()=>{
      trackEvent('quiz_add_to_cart_click', {product:b.getAttribute('data-name')});
      toast('Em produção: isso adiciona o item ao carrinho da Nuvemshop ✨');
    });
  });
  document.getElementById('shareIG').addEventListener('click', ()=> toast('Em produção: abre o compartilhamento do resultado no Instagram'));
  document.getElementById('shareWA').addEventListener('click', ()=> toast('Em produção: abre o compartilhamento do resultado no WhatsApp'));
  document.getElementById('restartBtn').addEventListener('click', ()=>{
    state.screen='intro'; state.qIndex=0; state.answers={}; state.lead={nome:'',email:'',whatsapp:'',consent:false};
    render(); updateChrome();
  });
}

render(); updateChrome();
</script>
